{% extends 'base.html' %}

{% block title %}Create Account | RecruiterFlowAI{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Create your account</h1>

            <p>
                Join RecruiterFlowAI as a candidate or recruiter.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary"
                    type="submit"
                    style="width:100%;">

                Create Account

            </button>

        </form>


        <p style="text-align:center; margin-top:18px; color:#667085; font-size:13px;">

            Already have an account?

            <a href="{% url 'login' %}"
               style="color:#4f46e5; font-weight:700;">

                Sign in

            </a>

        </p>

    </div>

</section>

{% endblock %}
