{% extends 'base.html' %}

{% block title %}Update Status | RecruiterFlowAI{% endblock %}

{% block content %}

<section class="page">

<div class="container">

<div class="form-card">

<h1>
Update Application
</h1>

<p class="form-description">

Candidate:
<strong>
{{ application.candidate.username }}
</strong>

<br>

Position:
<strong>
{{ application.job.title }}
</strong>

</p>


<form method="POST">

{% csrf_token %}

{{ form.as_p }}


<div class="form-actions">

<button
    class="btn btn-primary"
    type="submit">

    Update Status

</button>

<a
    href="{% url 'recruiter_applications' %}"
    class="btn btn-secondary">

    Cancel

</a>

</div>

</form>

</div>

</div>

</section>

{% endblock %}
