{% extends 'base.html' %}

{% block title %}Edit Job | RecruiterFlowAI{% endblock %}

{% block content %}

<section class="page">

    <div class="container">

        <div class="form-card">

            <h1>Edit Job</h1>

            <p class="form-description">
                Update your job posting information.
            </p>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">

                    <button type="submit"
                            class="btn btn-primary">

                        Save Changes

                    </button>

                    <a href="{% url 'job_list' %}"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
